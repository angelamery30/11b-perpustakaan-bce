<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Buku</title>
</head>
<body>
<h1>Daftar Buku</h1>

<form th:action="@{/buku}" method="get">
    <input type="text" name="kata" th:value="${kata}" placeholder="Cari judul">
    <button type="submit">Cari</button>
</form>

<p th:if="${#lists.isEmpty(daftarBuku)}">Buku tidak ditemukan.</p>

<table border="1" th:unless="${#lists.isEmpty(daftarBuku)}">
    <tr><th>ID</th><th>Judul</th><th>Stok</th></tr>
    <tr th:each="b : ${daftarBuku}">
        <td th:text="${b.idBuku}">B001</td>
        <td th:text="${b.judul}">Judul</td>
        <td th:text="${b.stok}">0</td>
    </tr>
</table>

<h2>Tambah Buku</h2>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<form th:action="@{/buku}" method="post">
    <input type="text" name="idBuku" placeholder="ID" maxlength="10" required>
    <input type="text" name="judul" placeholder="Judul" maxlength="200" required>
    <input type="number" name="stok" value="1" min="0" required>
    <button type="submit">Simpan</button>
</form>

<h2>Menu</h2>
<p>
    <a th:href="@{/anggota}">Lihat Anggota</a> |
    <a th:href="@{/peminjaman}">Peminjaman Buku</a>
</p>
</body>
</html>
